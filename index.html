<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varausjärjestelmä</title>
<link rel="icon" type="image/png" href="media/ChatGPT_cabin.png">
<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

</head>
<body>


<div id="lock-screen" class="lock-screen">
  <div class="top-bar">
    <button class="top-btn theme-btn" onclick="toggleTheme(this)">Tumma teema</button>
  </div>
  <div id="lock-box" class="lock-box">
    <h2>Varauskalenteri</h2>
    <p>Anna salasana jatkaaksesi</p>
    <input type="password" id="lock-input" placeholder="Salasana">
    <button id="lock-btn" class="lock-btn" onclick="unlock()">Kirjaudu sisään</button>
    <div id="lock-error" class="lock-error">Väärä salasana, yritä uudelleen.</div>
  </div>
</div> <!-- lock screen end -->


<div class="container" id="app" style="display:none;">
  <div class="top-bar">
    <button class="top-btn theme-btn" onclick="toggleTheme(this)">Tumma teema</button>
    <button class="top-btn danger" onclick="logout()">Kirjaudu ulos</button>
  </div>
  <header>
    <h1>Varauskalenteri</h1>
    <p>Selaa kalenteria ja lisää varaus alla olevalla lomakkeella.</p>
  </header>

  <div class="card">
    <div class="cal-header">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
      <div class="cal-label-wrap">
        <h2 id="month-label"></h2>
        <button class="nav-btn" onclick="goToToday()">Tänään</button>
      </div>
      <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
    </div>

    <div class="day-labels">
      <div class="day-label">Ma</div><div class="day-label">Ti</div><div class="day-label">Ke</div>
      <div class="day-label">To</div><div class="day-label">Pe</div><div class="day-label">La</div><div class="day-label">Su</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div> <!-- card end -->



  <div class="card">
    <p class="section-title">Uusi varaus</p>
    <div class="wrap">
      <div id="picker-wrap">
        <div class="form-row">

          <div class="form-group">
            <label for="start-display">Alku päivä</label>
            <div class="date-input-wrap">
              <input type="text" id="start-display" placeholder="Valitse ajanjakso" readonly>
              <img src="media/calendar_11.png" class="cal-icon" alt="" aria-hidden="true">
            </div>
          </div>

          <div class="form-group">
            <label for="end-display">Loppu päivä</label>
            <div class="date-input-wrap">
              <input type="text" id="end-display" placeholder="" readonly style="cursor:default;opacity:0.6;">
              <img src="media/calendar_11.png" class="cal-icon" alt="" aria-hidden="true">
            </div>
          </div>
        </div> <!-- form row end -->
      </div> <!-- picker wrap end -->
    </div> <!-- wrap end -->


    <div class="form-group" style="margin-bottom:12px;">
      <label for="booked-for">Varattu nimellä</label>
      <input type="text" class="plain-input" id="booked-for" placeholder="Nimi tai kuvaus…" maxlength="40">
    </div>
    <div id="form-error" class="error"></div>
    <button class="submit-btn" onclick="submitBooking()">Lisää varaus</button>
    <div id="result-msg" class="result-msg"></div>
  </div> <!-- new booking card end -->


  <div class="card" id="bookings-card" style="display:none;">
    <div class="tabs">
      <button class="tab active" id="tab-upcoming" onclick="switchTab('upcoming')">Tulevat</button>
      <button class="tab" id="tab-past" onclick="switchTab('past')">Menneet</button>
    </div>
    <div class="tab-year">
        <button class="nav-btn" onclick="changeListYear(-1)">&#8592;</button>
        <span id="list-year"></span>
        <button class="nav-btn" onclick="changeListYear(1)">&#8594;</button>
    </div>
    <div id="bookings-list"></div>
  </div> <!-- bookings card end -->

  <div id="confirm-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <p id="modal-message">Poistetaanko varaus?</p>
      <div class="modal-buttons">
        <button class="modal-cancel" onclick="closeModal()">Peruuta</button>
        <button class="modal-confirm" onclick="confirmAction()">Poista</button>
      </div>
    </div>
  </div> <!-- confirm-modal end -->
  
  <div id="edit-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <p style="font-weight:500; margin-bottom:1rem;">Muokkaa varausta</p>

      <div id="edit-picker-wrap" style="position:relative;">
        <div class="form-row">
          <div class="form-group">
            <label for="edit-start">Alku päivä</label>
            <div class="date-input-wrap">
              <input type="text" id="edit-start" class="plain-input" readonly>
              <img src="media/calendar_11.png" class="cal-icon" alt="" aria-hidden="true">
            </div>
          </div>
          <div class="form-group">
            <label for="edit-end">Loppu päivä</label>
            <div class="date-input-wrap">
              <input type="text" id="edit-end" class="plain-input" readonly>
              <img src="media/calendar_11.png" class="cal-icon" alt="" aria-hidden="true">
            </div>
          </div>
        </div>
      </div> <!-- edit-picker wrap end -->

      <div class="form-group" style="margin-bottom:1.25rem; text-align:left; margin-top:12px;">
        <label for="edit-name">Varattu nimellä</label>
        <input type="text" id="edit-name" class="plain-input" maxlength="40">
      </div>
      <div id="edit-error" class="error"></div>
      <div class="modal-buttons">
        <button class="modal-cancel" onclick="closeEditModal()">Peruuta</button>
        <button class="modal-confirm" style="background:var(--accent);" onclick="saveEdit()">Tallenna</button>
      </div>
    </div>
  </div> <!-- edit-modal end -->

</div> <!-- container end -->


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="mini-calendar_alt.js"></script>
<script src="theme-toggle.js"></script>

</body>
</html>
